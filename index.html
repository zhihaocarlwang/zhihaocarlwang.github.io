<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Zhihao Carl Wang — Shanghai University of Finance and Economics">
  <title>Zhihao Carl Wang</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color-scheme: light dark;
      background: #fafafa;
      color: #202124;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { width: min(100%, 780px); text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1.15;
    }
    p {
      margin: 1.2rem 0 0;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 400;
      line-height: 1.6;
      color: #555b65;
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #141519; color: #f4f4f5; }
      p { color: #b5bbc6; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Zhihao Carl Wang</h1>
    <p>Shanghai University of Finance and Economics</p>
  </main>
</body>
</html>
